<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学習ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c9edc4">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>学習ノート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one answer sheet per screen, a single wide column sized for an iPad held upright; a slim sticky bar carries time and save state. */
:root{
  --paper:#c9edc4; --paper2:#d9f4d3; --tint:#f1fbee; --onbg:#3d5a4a; --sheet:#ffffff; --ink:#1d3557; --soft:#5b7a99; --line:#b9e2f8;
  --ai:#0a84c9; --ai-d:#066aa3; --ai-bg:#dcf2ff; --shu:#e8453c; --ok:#12996a; --ok-bg:#d6f7e9; --warn:#c77700; --sun:#ffd43b; --sun-bg:#fff4c2; --hl:#fff27a;
  --d1:#ffb703; --d2:#ff6b6b; --d3:#1ea7e8; --d4:#2ec4a0; --d5:#ff922b; --d6:#9775fa;
  --f-q:"Klee One","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-en:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:18px;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:20px;padding-block:20px 80px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.7rem}
.wrap>.sub,.wrap>div>.sub,.grp>.sub,.hero .sub{color:var(--onbg)}
.sub{color:var(--soft);font-size:.95rem;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:860px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar-t{font-weight:700;flex:1;min-width:0}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;padding:2px 12px;border:2px solid var(--ink);border-radius:999px}
.clock.over{color:var(--shu);border-color:var(--shu)}
.save{font-size:.8rem;color:var(--soft)}
.save.bad{color:var(--warn)}
.btn{border:2px solid var(--ai);background:var(--ai);color:var(--sheet);border-radius:12px;padding:10px 20px;font-weight:700;min-height:48px}
.btn.ghost{background:transparent;color:var(--ai)}
.btn.sm{padding:4px 12px;min-height:38px;font-size:.9rem;border-radius:10px}
.btn.red{border-color:var(--shu);background:transparent;color:var(--shu)}
.grp{display:flex;flex-direction:column;gap:12px}
.grp h2{font-size:1.1rem;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px}
.card b{font-size:1.35rem}
.card small{color:var(--soft)}
.st{align-self:flex-start;margin-top:auto;font-size:.85rem;font-weight:700;border-radius:999px;padding:1px 12px;border:1.5px solid var(--line);color:var(--soft)}
.st.go{border-color:var(--ai);color:var(--ai)}
.st.done{border-color:var(--ok);color:var(--ok)}
.sec{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
.sec>h3{font-size:1.15rem;border-bottom:2px solid var(--ink);padding-bottom:6px}
.note{margin:0;color:var(--soft);font-size:.95rem}
.passage{font-family:var(--f-q);font-size:1.15rem;line-height:2;border-left:4px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:.6em}
.passage p{margin:0}
.en .passage,.en .q,.en .opt{font-family:var(--f-en)}
.en .passage{line-height:1.75;font-size:1.1rem}
.item{display:flex;flex-direction:column;gap:8px}
.item+.item{border-top:1px dashed var(--line);padding-top:16px}
.q{font-family:var(--f-q);font-size:1.25rem;line-height:2;margin:0}
.q .n{font-family:var(--f-ui);font-weight:700;color:var(--ai);margin-right:.5em;font-size:1rem}
.tg{background:var(--hl);padding:0 .15em;border-bottom:2px solid var(--ink);font-weight:600}
.blank{font-family:var(--f-q);font-size:1.2rem;border:0;border-bottom:2px solid var(--ink);background:var(--ai-bg);border-radius:6px 6px 0 0;padding:2px 8px;margin:0 4px;min-height:44px;text-align:center;max-width:100%}
.blank:disabled,.long:disabled{opacity:1;background:transparent;-webkit-text-fill-color:var(--ink)}
.long{font-family:var(--f-q);font-size:1.15rem;line-height:1.9;width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);padding:10px 12px;resize:vertical}
.en .long{font-family:var(--f-en)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opts.wide{grid-template-columns:1fr}
.opt{font-family:var(--f-q);text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;min-height:48px;display:flex;gap:10px;align-items:baseline}
.opt i{font-style:normal;font-family:var(--f-ui);font-weight:700;color:var(--soft)}
.opt.on{border-color:var(--ai);background:var(--ai-bg);box-shadow:inset 0 0 0 1px var(--ai)}
.opt.on i{color:var(--ai)}
.opt:disabled{cursor:default}
.inkbox{display:flex;flex-direction:column;gap:4px;max-width:100%}
.inkbox.s{width:300px}
.item>.inkbox:not(.s){margin-right:48px}
.item.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.item.calc>.cm{display:flex;flex-direction:column;gap:8px;min-width:0}
.item.calc>.inkbox.cs{margin-right:0}
@media(max-width:560px){.item.calc{grid-template-columns:1fr}}
canvas.ink.ro{touch-action:auto}
canvas.ink{display:block;width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas.ink.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 63px,var(--line) 63px 64px)}
.inktools{display:flex;gap:8px;justify-content:flex-end}
.ib{display:inline-flex;flex-direction:column;gap:2px;vertical-align:middle;margin:4px 6px;max-width:100%}
.ib canvas.ink{border-color:var(--ink);border-width:0 0 2px;border-radius:6px 6px 0 0;background:var(--ai-bg)}
.ib .btn{align-self:flex-end;min-height:32px;padding:0 10px;font-size:.8rem;border-width:1.5px}
.mk.o.sel{background:var(--shu);color:var(--sheet)}
.mk.x.sel{background:var(--soft);border-color:var(--soft);color:var(--sheet)}
.kj{gap:12px}
.kjh{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.kjm{width:140px;height:140px;border:2px solid var(--ink);border-radius:10px;position:relative;display:grid;place-items:center;flex:none;background:var(--sheet)}
.kjf{font-family:var(--f-q);font-size:96px;line-height:1}
.kji{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 220px;font-family:var(--f-q);font-size:1.1rem}
.kji b{font-family:var(--f-ui);font-size:.8rem;color:var(--sheet);background:var(--soft);border-radius:4px;padding:0 6px;margin-right:4px}
.kji .btn{align-self:flex-start}
.kjb{display:flex;gap:14px;flex-wrap:wrap}
.inkbox.sq{width:150px}
.g .inkbox.sq{width:96px}
.inkbox.sq>.btn{align-self:flex-end;min-height:32px;padding:0 10px;font-size:.8rem;border-width:1.5px}
.sqw{position:relative;width:100%;aspect-ratio:1;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden}
.sqw canvas.ink{position:relative;border:0;background:transparent;height:100%}
.kv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kv path{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.kv.bg path{stroke:var(--line);stroke-width:5.5}
.kv line{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2}
.kv text{font-size:7.5px;fill:var(--shu);font-family:var(--f-ui);font-weight:700}
.ansline{color:var(--shu);font-family:var(--f-q);margin:0}
.cinfo{margin-top:8px;font-size:.95rem}.cinfo summary{cursor:pointer;font-weight:700;color:var(--ai-d)}.cinfo ul{margin:6px 0 0;padding-left:1.3em}.cinfo li{margin:4px 0}
.aisug{font-size:.85rem;border-radius:999px;padding:2px 10px;background:var(--ai-bg);color:var(--ai-d)}.aisug.o{background:#e3f7e8;color:#1b7a3a}.aisug.x{background:#ffe6e6;color:#b3261e}.aisug.wait{opacity:.6}
.aicmt{background:var(--ai-bg);border-radius:12px;padding:10px 14px;font-size:.95rem}.aicmt p{margin:4px 0}.aicmt ul{margin:2px 0;padding-left:1.4em}
.ptline{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;margin:0}
.ptline b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.card.lock{opacity:.55;border-style:dashed}
.card.today{border-color:var(--ai);box-shadow:inset 0 0 0 1.5px var(--ai)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.kgrid .item+.item{border-top:0;padding-top:0}
.wc{font-size:.85rem;color:var(--soft);text-align:right}
.banner{background:var(--ai-bg);border-radius:12px;padding:12px 16px;margin:0}
.banner.red{background:transparent;border:2px solid var(--shu);color:var(--shu);font-weight:700}
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg ul{margin:0;padding-left:1.2em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
/* parent */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 18px;font-weight:700;min-height:44px}
.tab.on{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.v{font-weight:700}.v.a{color:var(--ok)}.v.b{color:var(--warn)}.v.c{color:var(--shu)}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line)}
.g .gq{font-family:var(--f-q);grid-column:1/-1;color:var(--soft);font-size:.95rem}
.g .ga{min-width:0;display:flex;flex-direction:column;gap:4px}
.g .ans{font-family:var(--f-q);font-size:1.1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.g .model{color:var(--shu);font-family:var(--f-q);font-size:.95rem}
.g .gm{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.mk{font-weight:700;font-size:1.3rem;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;line-height:1}
.mk.o{color:var(--shu);border-color:var(--shu)}
.mk.x{color:var(--soft)}
.pt{min-width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:700}
.pt.on{background:var(--shu);border-color:var(--shu);color:var(--sheet)}
.g .inkbox{width:min(100%,420px)}
.g .inkbox.s{width:220px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;color:var(--soft)}
.chk input{width:22px;height:22px}

/* ---- pop theme ---- */
body{background:repeating-linear-gradient(180deg,var(--paper) 0 90px,var(--paper2) 90px 180px);background-attachment:fixed;min-height:100vh}
h1{font-weight:900;font-size:2rem;letter-spacing:.02em}
.hero{display:flex;align-items:center;gap:14px}
.hero img{width:64px;height:64px;border-radius:18px;box-shadow:0 5px 0 var(--line);flex:none}
.bar{border-bottom:3px solid var(--line)}
.bar-t{font-weight:900}
.clock{border:3px solid var(--ai);color:var(--ai-d);background:var(--sheet)}
.btn{border-radius:999px;border-width:0;background:var(--ai);box-shadow:0 4px 0 var(--ai-d);font-weight:900;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ai-d)}
.btn.ghost{background:var(--sheet);color:var(--ai-d);border:2.5px solid var(--ai);box-shadow:0 3px 0 var(--line)}
.btn.red{background:var(--sheet);border:2.5px solid var(--shu);box-shadow:none}
.btn.sm{border-radius:999px}
.ib .btn,.inkbox.sq>.btn{box-shadow:none;border:2px solid var(--line);color:var(--soft)}
.grp h2{font-size:1.15rem;font-weight:900;color:var(--ink);background:var(--sun-bg);align-self:flex-start;padding:2px 16px;border-radius:999px;border:2.5px solid var(--sun)}
.card{border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);flex-direction:row;align-items:center;gap:14px;min-height:96px;transition:transform .08s,box-shadow .08s}
button.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.card .cb{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.card b{font-weight:900}
.dot{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.5rem;color:#fff;background:var(--d3)}
.dot.d1{background:var(--d1)}.dot.d2{background:var(--d2)}.dot.d3{background:var(--d3)}.dot.d4{background:var(--d4)}.dot.d5{background:var(--d5)}.dot.d6{background:var(--d6)}
.card.today{border-color:var(--ai);box-shadow:0 6px 0 var(--ai)}
.card.lock{box-shadow:none;border-style:dashed}
.st{margin-top:0;border-width:2px}
.st.go{background:var(--sun-bg);border-color:var(--sun);color:var(--ink)}
.st.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sec{border:3px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line)}
.sec>h3{border-bottom:0;background:var(--ai-bg);border-radius:14px;padding:8px 14px;font-weight:900}
.banner{border-radius:18px;border:2.5px solid var(--line);background:var(--sheet)}
.banner.red{border-color:var(--shu)}
.tg{border-bottom:0;border-radius:6px;padding:0 .2em;background:var(--hl)}
.blank,.ib canvas.ink{border-bottom:3px solid var(--ai)}
.opt{border-width:2.5px;border-radius:16px}
.opt.on{border-color:var(--ai);box-shadow:0 3px 0 var(--ai)}
.kjm{border:3px solid var(--ai);border-radius:18px}
.sqw{border-width:2.5px;border-radius:16px}
canvas.ink{border-width:2.5px;border-radius:16px}
.ptline{background:var(--sheet);border:3px solid var(--sun);border-radius:18px;padding:8px 16px;box-shadow:0 5px 0 var(--sun);align-self:flex-start}
.ptline b{color:var(--warn);font-weight:900}
.tab{border-width:2.5px;font-weight:900}
.tab.on{background:var(--ai);border-color:var(--ai);color:#fff}
.dlg{border:3px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line)}
.mk{border-width:2.5px}

/* ---- world cup road ---- */
.cup{background:var(--sheet);border:3px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.cup-h{display:flex;gap:8px 14px;align-items:baseline;flex-wrap:wrap;margin:0}
.cup-h b{font-size:1.5rem;font-weight:900;color:var(--ai-d)}
.road{display:grid;grid-template-columns:repeat(6,1fr);position:relative;padding-top:6px}
.road::before{content:"";position:absolute;left:8.33%;right:8.33%;top:28px;height:8px;border-radius:8px;background:var(--line)}
.road i{position:absolute;left:8.33%;top:28px;height:8px;border-radius:8px;background:var(--ok)}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:.8rem;font-weight:700;color:var(--soft);text-align:center;line-height:1.3}
.stp span{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-weight:900;font-size:1.1rem;color:var(--soft)}
.stp.on{color:var(--ink)}
.stp{white-space:nowrap}
.stp em{font-style:normal;display:block}
@media (max-width:520px){.stp{font-size:.62rem}.stp span{width:36px;height:36px}.stp img{width:40px;height:40px}}
.stp.on span{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.now span{background:var(--sun);border-color:var(--d5);color:var(--ink);box-shadow:0 0 0 5px var(--sun-bg)}
.stp img{width:52px;height:52px;border-radius:14px;margin-top:-4px;filter:grayscale(1);opacity:.5}
.stp.on img{filter:none;opacity:1;box-shadow:0 0 0 4px var(--sun)}
.champ{position:relative;overflow:hidden;border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center;background:var(--sun-bg);border:3px solid var(--sun)}
.champ img{width:84px;height:84px;border-radius:20px;flex:none}
.champ b{font-size:1.6rem;font-weight:900;display:block;line-height:1.3}
.champ.s2{background:var(--ai-bg);border-color:var(--ai)}
.champ.s3,.champ.wt{background:var(--sheet);border-color:var(--line)}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:cf 2.8s linear infinite}
@keyframes cf{to{transform:translateY(190px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.cabinet{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0;font-weight:900}
.titles{display:flex;gap:6px;flex-wrap:wrap;margin:0}.titles span{background:var(--sun-bg);border-radius:999px;padding:2px 12px;font-weight:900;font-size:.85rem}
.cabinet img{width:34px;height:34px;border-radius:9px}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;border:2.5px solid var(--ok);background:var(--ok-bg);font-family:var(--f-q);font-size:1.05rem;line-height:1.7;text-align:left}
.tip b{font-family:var(--f-ui);font-weight:900;font-size:.85rem;color:var(--ok)}
.tip.tv{border-color:var(--d5);background:var(--sun-bg)}
.tip.tv b{color:var(--warn)}
rt{font-size:.5em;font-family:var(--f-ui);font-weight:500;color:var(--soft);letter-spacing:0}
.q{line-height:2.3}.note{font-size:1.05rem;line-height:2.3;color:var(--ink);background:var(--tint);border-radius:14px;padding:10px 14px}
.ansline.todo{outline:3px dashed var(--warn);outline-offset:4px;border-radius:12px}
.ansline.todo .sm::before{content:"○か×を おしてね →";font-family:var(--f-ui);font-weight:900;font-size:.85rem;color:var(--warn);margin-right:6px}
@keyframes flash{0%,60%{background:#ffe27a}100%{background:transparent}}
.flash{animation:flash 1.4s}
.ansline.sample{display:block;line-height:1.9}

const TASK={},WEEKS=[],BASE=TASKS.length;
function satBefore(mon){const d=new Date(mon+'T12:00:00');d.setDate(d.getDate()-2);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
// Homework opens once the previous week's Saturday test has been handed in (or when its own Monday arrives, so a missed test never blocks a week).
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return ymd(x.getTime())}
const hwAll=w=>w._d.every(id=>{const v=S.vals[id]||{};return v.done&&v.rev});
function lockInfo(t,today){if(!t.open)return null;
  // No calendar: the child moves at his own pace. The test opens as soon as all five homeworks (incl. answer check) are finished.
  if(t.test){const w=WEEKS.find(x=>x._t===t.id);if(w&&hwAll(w))return null;return '5日分の宿題を ぜんぶ おわらせると ひらきます'}
  // While the test is open and not handed in, homework stays closed, so answers cannot be looked up.
  if(t.hw&&WEEKS.some(w=>w._t&&w.test&&w.id>=t.week&&hwAll(w)&&!(S.vals[w._t]||{}).done))return 'テストを出すまで見られません';
  // A week opens once the previous week's test has been handed in.
  if(t.hw){const pw=WEEKS.filter(w=>w.id<t.week).sort((a,b)=>a.id<b.id?1:-1)[0];
    if(pw&&pw._t){if((S.vals[pw._t]||{}).done)return null;return 'まえの週のテストを出すとひらきます'}}
  return null}
function setWeeks(list){TASKS.length=BASE;WEEKS.length=0;
  (list||[]).filter(w=>w&&w.id&&Array.isArray(w.days)).sort((a,b)=>a.id<b.id?1:-1).forEach(w=>{w=JSON.parse(JSON.stringify(w));if(w.n)w.label=w.n+'w';WEEKS.push(w);w._d=[];
    w.days.forEach((d,i)=>{const id='w'+w.id+'-'+(i+1);w._d.push(id);TASKS.push({id,group:w.label,title:(i+1)+'日目',day:i+1,open:true,week:w.id,min:d.min||30,pts:0,hw:true,sections:d.sections||[]})});
    if(w.test){w._t='w'+w.id+'-t';TASKS.push({id:w._t,group:w.label,title:'テスト',open:true,min:w.test.min||30,pts:0,test:true,sections:w.test.sections||[]})}});
  for(const k in TASK)delete TASK[k];TASKS.forEach(t=>TASK[t.id]=t);
  TASKS.slice(BASE).forEach(t=>{if(t.test)t.pts=items(t).reduce((n,it)=>n+(it.k==='fill'?(it.each?it.pts*it.b.length:it.pts)+(it.work?it.work.pts:0):(it.pts||0)),0)})}
const items=t=>t.sections.flatMap(s=>s.items.filter(i=>i.k));

/* ---------- state ---------- */
const S={vals:{},grades:{},ink:{},screen:'home',task:null,ptab:TASKS[0].id,running:false,parentOK:false};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){const j=JSON.stringify(v);try{localStorage.setItem(k,j)}catch(e){if(lsFree(k))try{localStorage.setItem(k,j)}catch(e2){}}},del(k){try{localStorage.removeItem(k)}catch(e){}},try(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
/* iPad の保存場所（約5MB）がいっぱいになると、答えが保存されないまま残り、開き直したときに消えて見える（10/16 に起きた）。
   いっぱいのときは、終わって送信ずみの日の手書きから端末の控えを消す（サーバーには残っていて、見るときに読みなおす＝ensureInk） */
function lsFree(keep){try{const dn=(typeof S!=='undefined'&&S.vals)||{},dt=JSON.parse(localStorage.getItem('gk1.dirty')||'{}'),c=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('gk1.ink.')||k===keep)continue;const tid=k.slice(8).split('__')[0];
    if(dn[tid]&&dn[tid].done&&!dt['data/'+tid+'.json'])c.push([tid,k])}
  if(!c.length)return false;c.sort((a,b)=>a[0]<b[0]?-1:1);const old=c[0][0];c.filter(x=>x[0]===old).forEach(x=>localStorage.removeItem(x[1]));return true}catch(e){return false}}
(function loadLocal(){
  setWeeks(LS.get('gk1.weeks'));
  const d=LS.get('gk1');if(d){S.vals=d.vals||{};S.grades=d.grades||{}}
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('gk1.ink.')){const v=LS.get(k);if(v)S.ink[k.slice(8)]=v}}}catch(e){}
  const r=LS.get('gk1.route');if(r&&r.task&&TASK[r.task]){S.screen='task';S.task=r.task}
})();
const V=t=>S.vals[t]||(S.vals[t]={v:{},el:0,started:false,done:false,t:0});
const G=t=>S.grades[t]||(S.grades[t]={m:{},o:{},read:{},t:0});
const ikey=(t,id)=>t+'__'+id;
const saveLocal=()=>LS.set('gk1',{vals:S.vals,grades:S.grades});

/* ---------- sync (private GitHub repository) ---------- */
const REPO='https://api.github.com/repos/RyoNagamatsu/gakushu-data',GH=REPO+'/contents/';
let token=LS.get('gk1.token')||'',saveErr=false,syncing=false,syncTm=null,hashDone=false;
const dirty=LS.get('gk1.dirty')||{},shas=LS.get('gk1.shas')||{};
const hdr=x=>Object.assign({Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},x||{});
const b64=s=>{const u=new TextEncoder().encode(s);let o='';for(let i=0;i<u.length;i+=0x8000)o+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(o)};
function mark(path,now){dirty[path]=1;LS.set('gk1.dirty',dirty);clearTimeout(syncTm);syncTm=setTimeout(sync,now?200:6000);status()}
function bodyFor(path){const p=path.split('/'),tid=p[1].replace(/\.json$/,'');
  if(p[0]==='grades')return S.grades[tid]||null;
  const v=S.vals[tid];if(!v)return null;const ink={};let t=v.t||0;
  Object.keys(S.ink).forEach(k=>{if(k.startsWith(tid+'__')){ink[k]=S.ink[k];t=Math.max(t,S.ink[k].t||0)}});return {t,vals:v,ink}}
// Merge one remote file into local state. Nothing is ever dropped: ink is merged box by box, and a finished task is not replaced by an unfinished copy unless a parent reopened it.
function newerVals(a,b){if(!b)return false;if(!a)return true;if(!!a.done!==!!b.done){const d=a.done?a:b,u=a.done?b:a;return ((u.unlockedAt||0)>(d.doneAt||0))?u===b:d===b}return (b.t||0)>(a.t||0)}
/* 終わっていない日の2つの控えを合わせる：base にない答えを other から足し、かかった時間は長いほう。足したら true */
function unionVals(base,other){let add=false;if((other.el||0)>(base.el||0)){base.el=other.el;add=true}
  ['v','kj','self','rc','ai'].forEach(f=>{const o=other[f];if(!o||typeof o!=='object')return;const b=base[f]||(base[f]={});Object.keys(o).forEach(k=>{if(!(k in b)){b[k]=o[k];add=true}})});
  if(add)base.t=Math.max(base.t||0,other.t||0)+1;return add}
function mergeRemote(path,x){const p=path.split('/'),tid=p[1].replace(/\.json$/,'');let ch=false;if(!x)return ch;
  if(p[0]==='grades'){if((x.t||0)>((S.grades[tid]||{}).t||0)){x.m=x.m||{};x.o=x.o||{};x.read=x.read||{};S.grades[tid]=x;ch=true}return ch}
  const lv=S.vals[tid];
  if(x.vals&&newerVals(lv,x.vals)){x.vals.v=x.vals.v||{};S.vals[tid]=x.vals;ch=true;if(lv&&!lv.done&&!x.vals.done&&unionVals(x.vals,lv)){mark(path)}}
  else if(x.vals&&lv&&!lv.done&&!x.vals.done&&unionVals(lv,x.vals)){ch=true;mark(path)}
  Object.keys(x.ink||{}).forEach(k=>{const i=x.ink[k];if(i&&Array.isArray(i.s)&&(i.t||0)>((S.ink[k]||{}).t||0)){S.ink[k]=i.g?{s:i.s,t:i.t,g:i.g}:{s:i.s,t:i.t};if((S.vals[tid]||{}).done)LS.try('gk1.ink.'+k,S.ink[k]);else LS.set('gk1.ink.'+k,S.ink[k]);ch=true}});
  if(ch){saveLocal();try{inks.forEach(i=>i.draw())}catch(e){}}return ch}
async function getRemote(path){const g=await fetch(GH+path+'?t='+Date.now(),{headers:hdr(),cache:'no-store'});if(g.status===404)return null;if(!g.ok)throw new Error('get '+g.status);const j=await g.json();shas[path]=j.sha;
  let txt=j.content?new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0))):null;
  if(txt===null){const r=await fetch(GH+path,{headers:hdr({Accept:'application/vnd.github.raw+json'}),cache:'no-store'});if(!r.ok)throw new Error('raw '+r.status);txt=await r.text()}
  return JSON.parse(txt)}
async function put(path){try{mergeRemote(path,await getRemote(path))}catch(e){return false}
  const data=bodyFor(path);if(!data)return true;
  const send=()=>fetch(GH+path,{method:'PUT',headers:hdr(),body:JSON.stringify({message:'save '+path,content:b64(JSON.stringify(data)),sha:shas[path]||undefined})});
  let r=await send();
  if(r.status===409||r.status===422){const g=await fetch(GH+path,{headers:hdr(),cache:'no-store'});if(g.ok){shas[path]=(await g.json()).sha;r=await send()}}
  if(!r.ok)return false;shas[path]=(await r.json()).content.sha;LS.set('gk1.shas',shas);return true}
async function sync(){if(!token||syncing)return;syncing=true;status();
  try{for(const path of Object.keys(dirty)){delete dirty[path];let ok=false;try{ok=await put(path)}catch(e){}if(!ok){dirty[path]=1;saveErr=true;break}saveErr=false}}
  finally{syncing=false;LS.set('gk1.dirty',dirty);status()}
  if(Object.keys(dirty).length){clearTimeout(syncTm);syncTm=setTimeout(sync,saveErr?30000:500)}}
function flushAll(){clearTimeout(syncTm);sync()}
function touchVals(t){const v=V(t);v.t=Date.now();saveLocal();mark('data/'+t+'.json')}
function touchGrades(t){const g=G(t);g.t=Date.now();saveLocal();mark('grades/'+t+'.json')}
function touchInk(key){const r=S.ink[key];r.t=Date.now();LS.set('gk1.ink.'+key,r);mark('data/'+key.split('__')[0]+'.json')}
function status(){const el=document.getElementById('save');if(!el)return;
  el.className='save'+(token&&saveErr&&navigator.onLine!==false?' bad':'');
  el.textContent=!token?'このiPadに保存ずみ':(navigator.onLine===false)?'オフライン（iPadに保存ずみ）':saveErr?'送信できていません':(syncing||Object.keys(dirty).length)?'保存中…':'保存ずみ'}
async function loadWeeks(){try{const r=await fetch('weeks/index.json',{cache:'no-store'});if(!r.ok)return false;const ids=(await r.json()).slice(-8);
    const list=(await Promise.all(ids.map(id=>fetch('weeks/'+id+'.json',{cache:'no-store'}).then(x=>x.ok?x.json():null).catch(()=>null)))).filter(Boolean);
    if(list.length&&JSON.stringify(list)!==JSON.stringify(LS.get('gk1.weeks')||[])){LS.set('gk1.weeks',list);if(!S.running){setWeeks(list);return true}}}catch(e){}
  return false}
async function pull(){let ch=await loadWeeks();if(!token)return ch;
  try{for(const dir of ['data','grades']){const r=await fetch(GH+dir,{headers:hdr(),cache:'no-store'});if(r.status===404)continue;if(!r.ok){saveErr=true;continue}
      for(const f of await r.json()){const path=dir+'/'+f.name,tid=f.name.replace(/\.json$/,'');if(shas[path]===f.sha&&(dir==='data'?S.vals[tid]:S.grades[tid]))continue;
        const g=await fetch(GH+path,{headers:hdr({Accept:'application/vnd.github.raw+json'}),cache:'no-store'});if(!g.ok)continue;const x=await g.json();shas[path]=f.sha;
        if(mergeRemote(path,x))ch=true}}
    LS.set('gk1.shas',shas);if(ch)saveLocal()}catch(e){}
  return ch}
/* 端末の控えから消した（lsFree）終わった日の手書きを、見るときにサーバーから読みなおす（10/27「過去の宿題が消えた」）。1回の起動で1日1回まで */
const inkAsked={};

  for(let i=0;i<200&&s.length>1;i++){try{return close(s)}catch(e){const c=s.lastIndexOf(',');if(c<1)break;s=s.slice(0,c)}}

let penSeen=false,penDown=false;const inks=[];

function mkInk(host,key,lh,ro,ruled,free,onchg,row){
  const c=document.createElement('canvas');c.className='ink'+(ruled?' ruled':'')+(ro?' ro':'');c.style.aspectRatio='1000/'+lh;c.setAttribute('aria-label','手書きのわく');host.appendChild(c);

  let cur=null,drawer=null;
  function draw(){const w=c.clientWidth;if(!w)return;const dpr=window.devicePixelRatio||1;const W=Math.round(w*dpr),H=Math.round(w*lh/1000*dpr);
    if(c.width!==W||c.height!==H){c.width=W;c.height=H}
    const x=c.getContext('2d'),k=W/1000;x.clearRect(0,0,W,H);if(row){x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#cfd6e4';x.lineWidth=Math.max(1,dpr);for(let y=row;y<=lh;y+=row){const yy=Math.round(y*k)+0.5;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}}x.lineCap='round';x.lineJoin='round';x.lineWidth=Math.max(1.6,2.4*dpr*(ro?0.8:1));
    const col=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1b2742';x.strokeStyle=col;x.fillStyle=col;
    const all=strokes().map(s=>s.split(',').map(Number));if(cur)all.push(cur);
    all.forEach(p=>{if(p.length<4){x.beginPath();x.arc(p[0]*k,p[1]*k,x.lineWidth*0.7,0,7);x.fill();return}
      x.beginPath();x.moveTo(p[0]*k,p[1]*k);for(let i=2;i<p.length;i+=2)x.lineTo(p[i]*k,p[i+1]*k);x.stroke()})}
  const pt=e=>{const r=c.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*1000),Math.round((e.clientY-r.top)/r.width*1000)]};
  if(!ro){
    let last=0,raf=0,col='#1b2742';
    const seg=()=>{raf=0;if(!cur||cur.length<4||last>=cur.length)return;const x=c.getContext('2d'),k=c.width/1000,dpr=window.devicePixelRatio||1;
      x.lineCap='round';x.lineJoin='round';x.lineWidth=Math.max(1.6,2.4*dpr);x.strokeStyle=col;
      x.beginPath();x.moveTo(cur[last-2]*k,cur[last-1]*k);for(let i=last;i<cur.length;i+=2)x.lineTo(cur[i]*k,cur[i+1]*k);x.stroke();last=cur.length};

      setTimeout(()=>{touchInk(key);if(free)paintReview();if(onchg)onchg()},0)};
    c.addEventListener('pointerdown',e=>{if(!can())return;if(e.pointerType==='pen')penSeen=true;if(penSeen&&e.pointerType==='touch')return;

      col=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1b2742';cur=pt(e);last=2;draw()});
    c.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==drawer)return;e.preventDefault();
      const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
      evs.forEach(ev=>{const p=pt(ev),n=cur.length;if(Math.abs(p[0]-cur[n-2])+Math.abs(p[1]-cur[n-1])>=2)cur.push(p[0],p[1])});if(!raf)raf=requestAnimationFrame(seg)});

const KVP={};
function kv(ch){const k=(ch.codePointAt(0)>>8).toString(16).padStart(2,'0');if(!KVP[k])KVP[k]=fetch('kv/'+k+'.json').then(r=>r.ok?r.json():{}).catch(()=>({}));return KVP[k].then(m=>m[ch]||null)}
const GUIDE='<line x1="54.5" y1="0" x2="54.5" y2="109"/><line x1="0" y1="54.5" x2="109" y2="54.5"/>';
function kvSvg(d,mode){return `<svg viewBox="0 0 109 109" class="kv ${mode}" aria-hidden="true">${GUIDE}${d?d.p.map(p=>`<path d="${p}"/>`).join(''):''}${d&&mode==='model'?d.n.map((n,i)=>`<text x="${n[0]}" y="${n[1]}">${i+1}</text>`).join(''):''}</svg>`}
function sqHost(box){if(!box.classList.contains('sq'))return box;const w=document.createElement('div');w.className='sqw';w.innerHTML=kvSvg(null,'bg');box.appendChild(w);
  if(box.dataset.kvbg)kv(box.dataset.kvbg).then(d=>{if(d&&w.isConnected){const c=w.querySelector('canvas');w.querySelector('svg').remove();w.insertAdjacentHTML('afterbegin',kvSvg(d,'bg'));if(c)w.appendChild(c)}});return w}
function mountModels(){app.querySelectorAll('.kjm[data-kv]').forEach(m=>kv(m.dataset.kv).then(d=>{if(d&&m.isConnected)m.innerHTML=kvSvg(d,'model')}))}
function play(box){const ps=[...box.querySelectorAll('path')];if(!ps.length)return;const tk=box._tk=(box._tk||0)+1;
  ps.forEach(p=>{const L=p.getTotalLength();p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=L});let i=0;
  (function next(){if(box._tk!==tk||i>=ps.length)return;const p=ps[i++],ms=Math.max(350,p.getTotalLength()*9);p.getBoundingClientRect();p.style.transition='stroke-dashoffset '+ms+'ms linear';p.style.strokeDashoffset=0;setTimeout(next,ms+250)})()}

/* ---------- lenient kanji check ----------
   Compares the child's strokes with the model (KanjiVG). Small differences in angle, size and position pass.
   A box fails only when the number of strokes is wrong or a stroke is clearly somewhere else. After 3 failed tries the box is accepted and flagged for a parent. */
const KREF={};
function refStrokes(ch){if(!KREF[ch])KREF[ch]=kv(ch).then(d=>{if(!d)return null;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.style.cssText='position:absolute;width:0;height:0;overflow:hidden';document.body.appendChild(svg);
    const out=d.p.map(dd=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',dd);svg.appendChild(p);const L=p.getTotalLength(),a=[];for(let i=0;i<8;i++){const q=p.getPointAtLength(L*i/7);a.push([q.x,q.y])}return a});svg.remove();return out}).catch(()=>null);return KREF[ch]}
function resample(pts,n){const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const L=d[d.length-1],o=[];
  if(!L)return Array.from({length:n},()=>pts[0].slice());
  for(let k=0,j=1;k<n;k++){const t=L*k/(n-1);while(j<pts.length-1&&d[j]<t)j++;const r=(t-d[j-1])/((d[j]-d[j-1])||1);o.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*r,pts[j-1][1]+(pts[j][1]-pts[j-1][1])*r])}return o}
function normSet(set){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;set.forEach(s=>s.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])}));
  const sc=Math.max(x1-x0,y1-y0)||1,cx=(x0+x1)/2,cy=(y0+y1)/2;return set.map(s=>s.map(p=>[(p[0]-cx)/sc,(p[1]-cy)/sc]))}
const sdist=(a,b,rev)=>{let t=0;for(let i=0;i<a.length;i++){const q=b[rev?b.length-1-i:i];t+=Math.hypot(a[i][0]-q[0],a[i][1]-q[1])}return t/a.length};
function childStrokes(key){const r=S.ink[key];if(!r)return [];return r.s.map(x=>{const a=x.split(',').map(Number),p=[];for(let i=0;i<a.length;i+=2)p.push([a[i],a[i+1]]);return p})
  .filter(p=>{let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L>=18||p.length<=2&&false})}
// returns 'ok' | 'note' (shape fine, order or direction differs) | 'ng' | 'few' (fewer strokes than the model so far) | null (empty)
async function judgeKanji(key,ch){const ref=await refStrokes(ch);if(!ref)return null;const cs=childStrokes(key);if(!cs.length)return null;if(cs.length<ref.length)return 'few';if(cs.length>ref.length)return 'ng';
  const R=normSet(ref),C=normSet(cs.map(s=>resample(s,8)));
  if(R.every((r,i)=>sdist(r,C[i])<0.24))return 'ok';
  const used=new Set();for(const r of R){let best=-1,bd=9;C.forEach((c,j)=>{if(used.has(j))return;const d=Math.min(sdist(r,c),sdist(r,c,true));if(d<bd){bd=d;best=j}});if(bd>=0.3)return 'ng';used.add(best)}
  return 'note'}
async function judgeBox(tid,ikeyPart,ch,cleared,quiet){const v=V(tid),key=ikey(tid,ikeyPart);v.kj=v.kj||{};const st=v.kj[ikeyPart]||(v.kj[ikeyPart]={n:0});
  if(cleared){st.r=null;st.c=false}else{const r=await judgeKanji(key,ch);
    if(r==='ng'&&!st.c&&!quiet){st.n=(st.n||0)+1;st.c=true}if(r==='ok'||r==='note')st.c=false;st.r=r;if(r==='ng'&&st.n>=3)st.f=true}
  if(!quiet)touchVals(tid);
  const el=document.querySelector('[data-kst="'+ikeyPart+'"]');if(!el)return;const bad=st.r==='ng'&&!st.f;
  el.className='kst'+(st.r==='ok'||st.r==='note'?' ok':bad?' ng':st.r==='ng'?' fl':'');
  el.textContent=st.r==='ok'?'○ よくかけました':st.r==='note'?'○ かたちはOK。かきじゅんを 見てみよう':bad?'もういちど かこう（「けす」を おす）':st.r==='ng'?'おうちの人に 見てもらおう':''}

const FRE=new RegExp(Object.keys(FURI).sort((a,b)=>b.length-a.length).join('|'),'g');
function furi(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return(!p||p.closest('ruby,.tg,.kjm,.kji,.sec,.noruby,.en,.ansline,.whyline,.tips,textarea,script,style'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}}),ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const t=n.nodeValue;FRE.lastIndex=0;if(!FRE.test(t))return;const f=document.createDocumentFragment();let last=0;
    t.replace(FRE,(m,i)=>{if(i>last)f.append(t.slice(last,i));const r=document.createElement('ruby');r.append(m);const rt=document.createElement('rt');rt.textContent=FURI[m];r.append(rt);f.append(r);last=i+m.length;return m});
    if(last<t.length)f.append(t.slice(last));n.replaceWith(f)})}

/* ---------- 英検2級 面接れんしゅう ----------
   面接官の質問を iPad の読み上げで流し、子どもの答えを音声認識で文字にして（できれば録音も）、最後に Claude API で採点する。
   結果は data/mz-<セットID>.json に保存（vals.att に1回ごとの記録。音声は保存しない）。本番は 2026-11-08。 */
const MZ_DAY='2026-11-08';
const MZ={run:null,stream:null,rec:true,honban:false,srOK:!!(window.SpeechRecognition||window.webkitSpeechRecognition),wake:null,ac:null};
try{MZ.honban=!!LS.get('gk1.mzhonban')}catch(e){}
const mzDays=()=>Math.round((new Date(MZ_DAY+'T12:00:00')-new Date(ymd(Date.now())+'T12:00:00'))/864e5);
const mzAtt=id=>((S.vals['mz-'+id]||{}).att)||[];
const mzAllAtt=()=>MZ_SETS.flatMap(s=>mzAtt(s.id).map(a=>Object.assign({set:s.id},a)));
function mzTip(k,open){const t=MZ_TIPS[k];if(!t)return '';return `<details class="mztip"${open?' open':''}><summary>${rich(t[0])}</summary><p>${rich(t[1])}</p></details>`}
function mzVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB|AU)/i.test(v.lang));
  return vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Ava|Allison|Susan|Nicky/.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs[0]||null}catch(e){return null}}
/* iPhone・iPad では、(1) 最初の読み上げはタップの中で始めないと音が出ない、(2) マイクを使っている間は読み上げの音が消える。
   そこで、タップしたときに無音の読み上げで「音を出してよい」状態にし（mzUnlock）、読み上げの前には必ずマイクを止める（mzMicOff）。
   読み上げが始まらなかったときは MZ.ttsFail を立てて、画面に文字と案内を出す */
function mzUnlock(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='en-US';speechSynthesis.speak(u);speechSynthesis.resume()}catch(e){}
  try{MZ.ac=MZ.ac||new (window.AudioContext||window.webkitAudioContext)();MZ.ac.resume()}catch(e){}}
function mzSay(text,rate){return new Promise(res=>{let done=false,started=false,tm=null;const fin=()=>{if(done)return;done=true;clearTimeout(tm);res(started)};
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';const v=mzVoice();if(v)u.voice=v;u.rate=rate||0.9;u.volume=1;
    u.onstart=()=>{started=true;if(MZ.ttsFail){MZ.ttsFail=false;const b=document.getElementById('mztts');if(b)b.hidden=true}clearTimeout(tm);tm=setTimeout(fin,8000+text.length*120)};
    u.onend=()=>{started=true;fin()};u.onerror=fin;
    tm=setTimeout(()=>{if(!started){MZ.ttsFail=true;const b=document.getElementById('mztts');if(b)b.hidden=false;try{speechSynthesis.cancel()}catch(e){}}fin()},3500);
    setTimeout(()=>{if(!done)speechSynthesis.speak(u)},MZ.stream?0:60)}catch(e){MZ.ttsFail=true;fin()}})}
async function mzMic(){if(MZ.stream&&MZ.stream.getTracks().some(t=>t.readyState==='live'))return MZ.stream;
  MZ.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});return MZ.stream}
function mzMicOff(keepWake){try{MZ.stream&&MZ.stream.getTracks().forEach(t=>t.stop())}catch(e){}MZ.stream=null;try{MZ.ac&&MZ.ac.state==='running'&&MZ.ac.suspend()}catch(e){}
  if(!keepWake){try{MZ.wake&&MZ.wake.release()}catch(e){}MZ.wake=null}}
/* 答えを1つ聞く。音声認識（文字）＋録音（聞き直し用）。録音と聞き取りが同時にできない端末では、録音をやめて聞き取りだけにする */
function mzListen(maxSec,ui){return new Promise(async resolve=>{
  const SRc=window.SpeechRecognition||window.webkitSpeechRecognition;const t0=Date.now();let fin=[],interim='',first=0,stopped=false,sr=null,mr=null,chunks=[],err='',meter=null;
  if(MZ.rec&&window.MediaRecorder){try{const st=await mzMic();mr=new MediaRecorder(st);mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mr.start(250);
      try{MZ.ac=MZ.ac||new (window.AudioContext||window.webkitAudioContext)();await MZ.ac.resume();const an=MZ.ac.createAnalyser();an.fftSize=256;MZ.ac.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.fftSize);
        meter=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const b of buf)m=Math.max(m,Math.abs(b-128));ui.level(m/128)},90)}catch(e){}}catch(e){mr=null}}
  const startSR=()=>{if(!SRc||stopped)return;try{sr=new SRc();sr.lang='en-US';sr.continuous=true;sr.interimResults=true;sr.maxAlternatives=1;
    sr.onresult=e=>{if(!first)first=Date.now();let im='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin.push(r[0].transcript.trim());else im+=r[0].transcript}interim=im.trim();
      ui.text((fin.join(' ')+' '+interim).trim());if(!meter)ui.level(.6)};
    sr.onerror=e=>{err=e.error||'error'};
    sr.onend=()=>{sr=null;if(!stopped&&Date.now()-t0<maxSec*1000&&!['not-allowed','service-not-allowed','audio-capture'].includes(err))setTimeout(startSR,120)};
    sr.start()}catch(e){err=err||'start'}};
  startSR();
  const stop=async()=>{if(stopped)return;stopped=true;clearTimeout(tm);clearInterval(meter);
    if(sr){await new Promise(r=>{const x=sr;const t=setTimeout(r,1500);x.onend=()=>{clearTimeout(t);r()};try{x.stop()}catch(e){clearTimeout(t);r()}})}
    if(interim)fin.push(interim);let blob=null;
    if(mr&&mr.state!=='inactive'){await new Promise(r=>{mr.onstop=r;try{mr.stop()}catch(e){r()}});if(chunks.length)blob=new Blob(chunks,{type:mr.mimeType||'audio/mp4'})}
    mzMicOff(true);await sleep(350);
    const text=fin.join(' ').replace(/\s+/g,' ').trim();
    resolve({text,dur:Math.round((Date.now()-t0)/100)/10,lat:first?Math.round((first-t0)/100)/10:null,blob,err,usedRec:!!mr})};
  const tm=setTimeout(stop,maxSec*1000);ui.stop=stop})}

/* 1セットの流れ。k: say=読み上げだけ, wait=○びょう待つ, ask=読み上げて答えを聞く */
function mzSteps(s){return [
  {k:'ask',part:'name',tip:'flow',say:'Hello. May I have your name, please?',max:15,hint:'My name is ◯◯.'},
  {k:'ask',part:'how',tip:'att',say:'Thank you. How are you today?',max:15,hint:"I'm fine, thank you."},
  {k:'wait',part:'silent',tip:'silent',card:1,say:"OK. Let's start the test. Here is your card. First, please read the passage silently for 20 seconds.",sec:20},
  {k:'ask',part:'read',tip:'read',card:1,say:'All right. Now, please read it aloud.',max:80},
  {k:'ask',part:'no1',tip:'no1',card:1,say:"Now, I'm going to ask you four questions. No. 1. "+s.q1,q:s.q1,max:45},
  {k:'wait',part:'prep2',tip:'no2',card:2,say:'No. 2. Now, please look at the picture and describe the situation. You have 20 seconds to prepare. Your story should begin with the sentence on the card.',sec:20},
  {k:'ask',part:'no2',tip:'no2',card:2,say:'Please begin.',max:90},
  {k:'ask',part:'no3',tip:'no3',say:'Now, please turn over the card and put it down. No. 3. '+s.q3,q:s.q3,max:50},
  {k:'ask',part:'no4',tip:'no4',say:'No. 4. '+s.q4,q:s.q4,max:30,follow:true},
  {k:'ask',part:'card',tip:'end',say:'Thank you. That is all. May I have the card back, please?',max:12,hint:'Here you are.'},
  {k:'ask',part:'bye',tip:'end',say:'Thank you. You may go now.',max:12,hint:'Thank you. Goodbye.'}]}

function mzCardHTML(s,mode){if(mode===1)return `<div class="mzcard en"><h3>${esc(s.title)}</h3><p>${esc(s.passage)}</p></div>`;
  if(mode===2)return `<div class="mzcard en"><p class="mzfirst">Your story should begin with this sentence: <b>${esc(s.first)}</b></p><div class="mzpanels">${s.panels.map((p,i)=>`<div class="mzp"><span class="mzcap">${p.cap?esc(p.cap):'&nbsp;'}</span>${p.svg?`<div class="mzbox mzsvg" role="img" aria-label="${esc(p.alt)}">${p.svg}</div>`:`<div class="mzbox" role="img" aria-label="${esc(p.alt)}">${p.b?`<span class="mzbub">${esc(p.b)}</span>`:''}<span class="mzemo">${p.e.join(' ')}</span></div>`}${i<2?'<span class="mzarr" aria-hidden="true">→</span>':''}</div>`).join('')}</div>${s.panels.every(p=>p.k)?`<details class="mzhint"><summary>ヒント（つかう ことば）</summary><ol>${s.panels.map(p=>`<li>${esc(p.k)}</li>`).join('')}</ol></details>`:''}</div>`;
  return ''}

function renderMZ(){if(MZ.run)return mzPaint();
  const d=mzDays(),att=mzAllAtt(),today=att.filter(a=>ymd(a.at)===ymd(Date.now())).length;
  const best=id=>{const a=mzAtt(id).filter(x=>typeof x.total==='number');return a.length?Math.max(...a.map(x=>x.total)):null};
  const nextSet=MZ_SETS.find(s=>!mzAtt(s.id).length)||MZ_SETS.slice().sort((a,b)=>(best(a.id)??99)-(best(b.id)??99))[0];
  app.innerHTML=`<div class="bar"><div class="bar-in"><button class="btn ghost sm" id="back">← もどる</button><span class="bar-t">英検2級 面接れんしゅう</span><span class="save" id="save"></span></div></div>
  <div class="wrap">
   <div class="mzhead"><div><b class="mzcount">${d>0?'本番まで あと'+d+'日':d===0?'きょうが 本番！':'本番は おわりました'}</b><p class="sub">11月8日（日）・日本人会サートーン本館。1日1セットを目標に。きょうは ${today}回 やりました。</p></div></div>
   ${MZ.srOK?'':'<p class="banner red noruby">このiPadでは、話したことばを文字にする機能が使えません。設定 → 一般 → キーボード →「音声入力」をオンにしてから、アプリを開き直してください。</p>'}
   ${akey?'':'<p class="banner noruby">保護者の方へ：AIの採点には、保護者用画面のAPIキーが必要です。キーがなくても練習と録音の聞き直しはできます。</p>'}

async function mzGrade(s,rec){const A=rec.ans,T=k=>A[k]?`"${A[k].text||'(nothing recognized)'}" (started speaking after ${A[k].lat==null?'?':A[k].lat}s, total ${A[k].dur}s)`:'(not answered)';

Greeting "May I have your name?": ${T('name')}

No.2: ${T('no2')}
No.3: ${T('no3')}
No.4: ${T('no4')}${A.no4w?`  then to "${A.no4w.q}": ${T('no4w')}`:''}
"May I have the card back?": ${T('card')}
"You may go now.": ${T('bye')}

Reply with JSON only, no other text:
{"read":{"score":0,"good":"","fix":""},"no1":{"score":0,"good":"","fix":"","better":""},"no2":{"score":0,"good":"","fix":"","better":""},"no3":{"score":0,"good":"","fix":"","better":""},"no4":{"score":0,"good":"","fix":"","better":""},"att":{"score":0,"good":"","fix":""},"summary":"","next":""}

  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.ptab=b.dataset.tab;inks.length=0;renderParent();ensureInk(S.ptab);status();window.scrollTo(0,0)});
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>keep(()=>{const k=b.dataset.o,val=b.dataset.val==='1';if(g.o[k]===val)delete g.o[k];else g.o[k]=val;touchGrades(t.id)}));
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>keep(()=>{const k=b.dataset.g,p=+b.dataset.p;if(g.m[k]===p)delete g.m[k];else g.m[k]=p;touchGrades(t.id)}));
  app.querySelectorAll('[data-read]').forEach(c=>c.onchange=()=>{if(c.checked)g.read[c.dataset.read]=true;else delete g.read[c.dataset.read];touchGrades(t.id)});
  app.querySelector('#unlock').onclick=()=>keep(()=>{v.done=false;v.unlockedAt=Date.now();touchVals(t.id)});
  app.querySelector('#wipe').onclick=async()=>{if(await ask(`<b>${esc(t.title)}の答えと採点をすべて消しますか？</b><p class="sub">手書きもふくめて消えます。元にもどせません。</p>`,'消す','やめる'))keep(()=>{
    S.vals[t.id]={v:{},el:0,started:false,done:false,unlockedAt:Date.now(),t:0};touchVals(t.id);S.grades[t.id]={m:{},o:{},read:{},t:0};touchGrades(t.id);
    Object.keys(S.ink).filter(k=>k.startsWith(t.id+'__')).forEach(k=>{if(S.ink[k].s.length){S.ink[k].s=[];touchInk(k)}})})}}
function report(){const L=['【学習ノート 結果】'];
  TASKS.filter(x=>x.group===(TASK[S.ptab]||TASKS[0]).group).forEach(t=>{const v=V(t.id),g=G(t.id),T=total(t.id);
   L.push('',`■${t.title}：${v.done?'提出ずみ':v.started?'とちゅう':'未実施'}／時間 ${mmss(v.el||0)}（制限${t.min}分）`+(t.pts?`／${T.got}/${T.max}点`+(T.pend?`（未採点${T.pend}問）`:''):''));
   if(t.levels)L.push(t.levels.map(([k,n])=>{const x=T.lv[k]||{got:0,max:0};return `${n} ${x.got}/${x.max}`}).join('、'));
   if(!v.started)return;
   items(t).forEach(it=>{if(it.scratch)return;
    if(it.k==='fill'){L.push(`${it.id}: `+it.b.map((b,i)=>{const k=it.id+'.'+i,o=g.o[k];return o===true?'○':o===false?'×':hasInk(t.id,k)?'未採点':'空らん'}).join(' ')+(it.work?` ${it.work.label}=${typeof g.m[it.id+'.w']==='number'?g.m[it.id+'.w']+'点':hasInk(t.id,it.id+'.w')?'未採点':'なし'}`:'')+(g.read[it.id]?' 読み上げ':''))}
    else if(it.k==='choice')L.push(`${it.id}: ${v.v[it.id]||'-'} ${v.v[it.id]===it.a?'○':'×'}`);
    else if(it.k==='kanji')L.push(`${it.id}: 漢字「${it.ch}」 ${hasInk(t.id,it.id+'.a')?'書いた':'空らん'}`);
    else if(it.k==='ink')L.push(`${it.id}: 手書き `+(it.pts?(typeof g.m[it.id]==='number'?g.m[it.id]+'点':hasInk(t.id,it.id)?'未採点':'空らん'):(hasInk(t.id,it.id)?'あり（写真で送付）':'空らん')));
    else if(it.k==='long')L.push(`${it.id}: 手書き `+(it.pts?(typeof g.m[it.id]==='number'?g.m[it.id]+'点':hasInk(t.id,it.id)?'未採点':'空らん'):(hasInk(t.id,it.id)?'あり（写真で送付）':'空らん')))})});
  return L.join('\n')}
function pts(g,key,max,label){let h=label?`<span class="sub">${esc(label)}</span>`:'';for(let p=0;p<=max;p++)h+=`<button class="pt${g.m[key]===p?' on':''}" data-g="${key}" data-p="${p}">${p}</button>`;return h}

window.addEventListener('pagehide',()=>{if(S.running)stopClock();saveLocal();flushAll()});
render();openToday();
const BUILD='20261028171744';
async function checkUpdate(){if(S.running)return;try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.json()).v;
    let tried='';try{tried=sessionStorage.getItem('gk1.upd')||''}catch(e){}
    if(v&&v!==BUILD&&tried!==v){try{sessionStorage.setItem('gk1.upd',v)}catch(e){}try{await fetch(location.href.split('#')[0],{cache:'reload'})}catch(e){}location.reload()}}catch(e){}}
setInterval(()=>{if(!document.hidden)aiCatchUp()},60000);checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkUpdate();aiCatchUp()}});
/* ---------- offline ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
function warmFonts(){if(navigator.onLine===false||!document.fonts||!document.fonts.load)return;
  let txt='';try{txt=document.documentElement.textContent+JSON.stringify(LS.get('gk1.weeks')||[])}catch(e){return}
  const ch=[...new Set(txt)].filter(c=>c>' ').join('');
  ['400 16px "Klee One"','600 16px "Klee One"','500 16px "Zen Maru Gothic"','700 16px "Zen Maru Gothic"','900 16px "Zen Maru Gothic"','400 16px "Atkinson Hyperlegible"','700 16px "Atkinson Hyperlegible"'].forEach(f=>{try{document.fonts.load(f,ch).catch(()=>{})}catch(e){}})}
setTimeout(warmFonts,4000);setTimeout(aiCatchUp,6000);
window.addEventListener('online',()=>{saveErr=false;status();flushAll();checkUpdate();pull().then(ch=>{if(ch&&!S.running&&S.screen!=='task')render();warmFonts()});aiCatchUp()});
window.addEventListener('offline',()=>status());
</script>
